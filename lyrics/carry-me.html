<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3C1053">
    <title>Carry Me — Carrigtwohill Gospel Choir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/song-page.css">
</head>
<body>
    <div id="songPage"></div>

    <script type="application/json" id="song-data">
{
        "title": "Carry Me",
        "artist": "Aoibheann Carey-Philpott",
        "permission": "Lyrics by Aoibheann Carey-Philpott · Used with permission",
        "recording": null
}
    </script>

    <template id="lyrics-template">
<div class="section">Verse 1</div>
        <div class="verse">
            <span class="line">Mystic river, flow all over me</span>
            <span class="line">Carry my sins now, set me free</span>
            <span class="line">All of your waters heal my soul</span>
            <span class="line">Take these tears now, take them all, take them all</span>
        </div>

        <div class="section">Verse 2</div>
        <div class="verse">
            <span class="line">Rolling mother soothe my mind</span>
            <span class="line">On down on my knees now, can't hear my cries</span>
            <span class="line">Take my body if you must</span>
            <span class="line">All my dreams now have turned to dust, turned to dust</span>
        </div>

        <div class="section">Chorus</div>
        <div class="verse">
            <span class="line"><strong>Carry me Lord, carry me</strong></span>
            <span class="line"><strong>To the sea Lord, to the sea</strong></span>
        </div>

        <div class="section">Verse 3</div>
        <div class="verse">
            <span class="line">Everlasting and ancient love</span>
            <span class="line">You're bringing me closer to the Source</span>
            <span class="line">As I go now on your path</span>
            <span class="line">I feel the darkness fading fast, fading fast</span>
        </div>

        <div class="section">Chorus</div>
        <div class="verse">
            <span class="line"><strong>Carry me Lord, carry me</strong></span>
            <span class="line"><strong>To the sea Lord, to the sea</strong></span>
        </div>

        <div class="section">Verse 4</div>
        <div class="verse">
            <span class="line">My time has come, the end is near</span>
            <span class="line">In your arms I have no fear</span>
            <span class="line">As I we move closer to our sweet fate</span>
            <span class="line">I'm buoyed by love, I am saved, I am saved</span>
        </div>

        <div class="section">Final Chorus</div>
        <div class="verse">
            <span class="line"><strong>Carry me, Carry me</strong></span>
            <span class="line"><strong>Carry me, carry me</strong></span>
        </div>
    </template>

    <script src="../assets/song-page.js"></script>
</body>
</html>
