<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3C1053">
    <title>Siyahamba — Carrigtwohill Gospel Choir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/song-page.css">
</head>
<body>
    <div id="songPage"></div>

    <script type="application/json" id="song-data">
{
        "title": "Siyahamba",
        "artist": "Traditional South African Hymn",
        "permission": "Traditional South African hymn · Public domain"
}
    </script>

    <template id="lyrics-template">
<div class="section">Verse 1 <span class="direction">— Zulu</span></div>
        <div class="verse">
            <span class="line">Siyahamba ekukhanyeni kwenkos</span>
            <span class="line">Siyahamba ekukhanyeni kwenkos</span>
            <span class="line direction">(repeat)</span>
        </div>

        <div class="section">Chorus</div>
        <div class="verse">
            <span class="line">Siyahamba, 'hamba. Siyahamba, <span class="choir-note">(ooh)</span> 'hamba</span>
            <span class="line">Siyahamba ekukhanyeni kwenkos</span>
            <span class="line direction">(repeat)</span>
        </div>

        <div class="section">Verse 2 <span class="direction">— English</span></div>
        <div class="verse">
            <span class="line">We are marching in the light of God</span>
            <span class="line">We are marching in the light of God</span>
            <span class="line direction">(repeat)</span>
        </div>

        <div class="section">Chorus</div>
        <div class="verse">
            <span class="line">We are marching, marching. We are marching, <span class="choir-note">(ooh)</span> marching</span>
            <span class="line">We are marching in the light of God</span>
            <span class="line direction">(repeat)</span>
        </div>

        <div class="section">Verse 3</div>
        <div class="verse">
            <span class="line">We are learning in the love of God</span>
            <span class="line">We are learning in the love of God</span>
            <span class="line direction">(repeat)</span>
        </div>

        <div class="section">Chorus</div>
        <div class="verse">
            <span class="line">We are learning, learning. We are learning, <span class="choir-note">(ooh)</span> learning</span>
            <span class="line">We are learning in the love of God</span>
        </div>

        <div class="section">Verse 4</div>
        <div class="verse">
            <span class="line">We are singing in the light of God</span>
            <span class="line">We are singing in the light of God</span>
            <span class="line direction">(repeat)</span>
        </div>

        <div class="section">Chorus</div>
        <div class="verse">
            <span class="line">Singing, singing. We are singing, <span class="choir-note">(ooh)</span> singing</span>
            <span class="line">We are singing in the light of God</span>
            <span class="line direction">(repeat)</span>
        </div>
    </template>

    <script src="../assets/song-page.js"></script>
</body>
</html>
