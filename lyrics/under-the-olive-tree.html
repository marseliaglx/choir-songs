<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3C1053">
    <title>Under the Olive Tree — Carrigtwohill Gospel Choir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/song-page.css">
</head>
<body>
    <div id="songPage"></div>

    <script type="application/json" id="song-data">
{
        "title": "Under the Olive Tree",
        "artist": "Alan O'Brien",
        "permission": "Lyrics by Alan O'Brien · Used with permission",
        "recording": null
}
    </script>

    <template id="lyrics-template">
<div class="section">Verse 1</div>
        <div class="verse">
            <span class="line">Smoke on the skyline, sirens in the night,</span>
            <span class="line">Children hold their breath beneath a pale streetlight.</span>
            <span class="line">Homes turned to rubble, names etched in stone,</span>
            <span class="line">A land full of stories, now silence and drones.</span>
        </div>

        <div class="section">Chorus</div>
        <div class="verse">
            <span class="line">But the wind still whispers through the hills, <span class="choir-note">(wind still whispers)</span></span>
            <span class="line">Carrying prayers, the silence can't kill. <span class="choir-note">(carrying prayers)</span></span>
            <span class="line">Still, the moon rises on broken roofs,</span>
            <span class="line">And hope survives without needing proof <span class="choir-note">(Hope survives)</span></span>
        </div>

        <div class="section">Verse 2</div>
        <div class="verse">
            <span class="line">Under the olive tree, we dreamed of peace, <span class="choir-note">(ooooooh...)</span></span>
            <span class="line">Of laughter in the streets, and love released.</span>
            <span class="line">But the sky rains fire, and the earth it bleeds,</span>
            <span class="line">Still we stand, still we sing, under the olive tree.</span>
        </div>

        <div class="section">Verse 3</div>
        <div class="verse">
            <span class="line">Mothers clutch photos, faded by tears, <span class="choir-note">(ooooooh...)</span></span>
            <span class="line">Fathers dig graves with hands full of years.</span>
            <span class="line">Truth has a voice, but it's lost in the smoke,</span>
            <span class="line">Each side with a story, each heart that broke.</span>
        </div>

        <div class="section">Chorus</div>
        <div class="verse">
            <span class="line">But the wind still whispers through the hills, <span class="choir-note">(wind still whispers)</span></span>
            <span class="line">Carrying prayers, the silence can't kill. <span class="choir-note">(carrying prayers)</span></span>
            <span class="line">Still, the moon rises on broken roofs,</span>
            <span class="line">And hope survives without needing proof <span class="choir-note">(Hope survives)</span></span>
        </div>

        <div class="section">Verse 4 <span class="direction">— ALL</span></div>
        <div class="verse">
            <span class="line">If justice is blind, then why does it choose?</span>
            <span class="line">And how many lives must the headlines lose?</span>
            <span class="line">We don't want revenge, we just want to breathe—</span>
            <span class="line">To write our future, to live and to grieve.</span>
        </div>

        <div class="section">Final Chorus <span class="direction">— ALL</span></div>
        <div class="verse">
            <span class="line">But the wind still whispers through the hills</span>
            <span class="line">Carrying prayers, the silence can't kill.</span>
            <span class="line">Still, the moon rises on broken roofs,</span>
            <span class="line">And hope survives without needing proof.</span>
        </div>

        <div class="section">Verse 5</div>
        <div class="verse">
            <span class="line">Under the olive tree, we dreamed of peace, <span class="choir-note">(ooooh...)</span></span>
            <span class="line">Of laughter in the streets, and love released.</span>
            <span class="line">But the sky rains fire, and the earth it bleeds,</span>
            <span class="line">Still we stand, still we sing, under the olive tree. <span class="direction">..fade....</span></span>
        </div>
    </template>

    <script src="../assets/song-page.js"></script>
</body>
</html>
